<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHogar - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icono-electrohogar.png">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header>
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">
            <img src="img/icono-electrohogar.png" alt="Logotipo ElectroHogar" class="logo-img">
            <h1>ElectroHogar</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cocina.html">Cocina</a></li>
                <li><a href="lavado.html">Lavado</a></li>
                <li><a href="tecnologia.html">Tecnología</a></li>
                <li><a href="ofertas.html">Ofertas</a></li>
                <li><a href="sucursales.html">Sucursales</a></li>
            </ul>
        </nav>

        <div class="herramientas-usuario">
            <input type="search" id="buscador-productos" placeholder="🔍 Buscar productos..." onkeyup="filtrarProductos()" autocomplete="off">
            <button class="btn-icon" id="btn-login" title="Iniciar sesión" onclick="iniciarSesion()">👤 Iniciar Sesión</button>
            <button class="btn-icon" id="btn-carrito" onclick="window.location.href='carrito.html'">🛒 Carrito (<span id="contador-carrito">0</span>)</button>
            <button class="btn-icon" id="btn-tema" title="Cambiar tema" onclick="cambiarTema()">🌙</button>
            <button id="btn-panel-admin" class="btn-icon" style="display: none;" onclick="window.location.href='panel_admin.html'">⚙️ Panel</button>
        </div>
    </header>

    <main>
        <div class="contenedor-login">
            <h2>Iniciar Sesión</h2>

            <form onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="correo@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="••••" required>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>

                <div style="margin-top: 14px; text-align: center;">
                    <a href="recuperar_password.html" class="link-olvido" style="color: #007bff; text-decoration: none; font-size: 13.5px; font-weight: 500;">¿Olvidaste tu contraseña? Ingresa aquí.</a>
                </div>

                <a href="registro.html" class="link-registro">¿No tienes cuenta? Regístrate aquí</a>
            </form>
        </div>
    </main>

    <footer>
        <p>Todos los derechos reservados - Copyright 2026</p>
    </footer>
    <script src="script.js?v=5"></script>
</body>
</html>
