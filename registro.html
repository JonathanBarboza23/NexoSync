<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHogar - Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icono-electrohogar.png">
    <link rel="stylesheet" href="style.css?v=15">
    <style>
        .seccion-registro { display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 20px; }
        .caja-registro { background: #fff; border: 2px solid #000; border-radius: 8px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .caja-registro h2 { margin-top: 0; font-size: 24px; text-align: center; margin-bottom: 10px; }
        .caja-registro p.subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group-registro { margin-bottom: 18px; }
        .form-group-registro label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #333; }
        .form-group-registro input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s; }
        .form-group-registro input:focus { border-color: #000; outline: none; }
        .btn-registro { width: 100%; background: #000; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-registro:hover { background: #333; }
        .pie-registro { text-align: center; margin-top: 20px; font-size: 14px; color: #555; border-top: 1px solid #eee; padding-top: 15px; }
        .pie-registro a { color: #007bff; text-decoration: none; font-weight: bold; }
        .pie-registro a:hover { text-decoration: underline; }
        body.dark-mode .caja-registro { background: #1e1e1e; border-color: #444; color: #fff; }
        body.dark-mode .form-group-registro label, body.dark-mode .caja-registro p.subtitulo, body.dark-mode .pie-registro { color: #ccc; }
        body.dark-mode .btn-registro { background: #fff; color: #000; }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">
            <img src="img/icono-electrohogar.png" alt="Logotipo ElectroHogar" class="logo-img">
            <h1>ElectroHogar</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="activo">Inicio</a></li>
                <li><a href="cocina.html" class="">Cocina</a></li>
                <li><a href="lavado.html" class="">Lavado</a></li>
                <li><a href="tecnologia.html" class="">Tecnología</a></li>
                <li><a href="ofertas.html" class="">Ofertas</a></li>
                <li><a href="sucursales.html" class="">Sucursales</a></li>
            </ul>
        </nav>

        <div class="herramientas-usuario">
            <button class="btn-icon" id="btn-login" title="Iniciar sesión" onclick="window.location.href='login.html'">👤 Iniciar Sesión</button>
            <button class="btn-icon" id="btn-mis-compras" style="display: none; background:#007bff; color:#fff; font-weight:bold;" onclick="window.location.href='mis_compras.html'">📦 Mis Compras</button>
            <button class="btn-icon" id="btn-carrito" onclick="window.location.href='carrito.html'">🛒 Carrito (<span id="contador-carrito">0</span>)</button>
            <button class="btn-icon" id="btn-tema" title="Cambiar tema" onclick="cambiarTema()">🌙</button>
            <button id="btn-panel-admin" class="btn-icon" style="display: none;" onclick="window.location.href='panel_admin.html'">⚙️ Panel</button>
        </div>
    </header>
    <main>
        <section class="seccion-registro">
            <div class="caja-registro">
                <h2>📝 Crear Cuenta</h2>
                <p class="subtitulo">Únete a ElectroHogar para guardar tu carrito y agilizar tus compras.</p>

                <form onsubmit="procesarRegistro(event)">
                    <div class="form-group-registro">
                        <label for="reg-nombre">Nombre:</label>
                        <input type="text" id="reg-nombre" name="nombre" required placeholder="Ej: Juan" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s\'-]+$" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s\'-]/g, '')" title="Solo letras, espacios, acentos y apóstrofes (')">
                    </div>

                    <div class="form-group-registro">
                        <label for="reg-apellido">Apellido:</label>
                        <input type="text" id="reg-apellido" name="apellido" required placeholder="Ej: Pérez" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s\'-]+$" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s\'-]/g, '')" title="Solo letras, espacios, acentos y apóstrofes (')">
                    </div>

                    <div class="form-group-registro">
                        <label for="reg-dni">DNI (sin puntos ni espacios):</label>
                        <input type="text" id="reg-dni" name="dni" required placeholder="Ej: 38123456" pattern="\d{6,11}" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')" title="Ingresa entre 6 y 11 números">
                    </div>

                    <div class="form-group-registro">
                        <label for="reg-email">Correo Electrónico:</label>
                        <input type="email" id="reg-email" name="email" required placeholder="tu@correo.com">
                    </div>

                    <div class="form-group-registro">
                        <label for="reg-password">Contraseña:</label>
                        <input type="password" id="reg-password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                    </div>

                    <button type="submit" id="btn-submit-registro" class="btn-registro">Registrarme</button>
                </form>

                <div class="pie-registro">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión aquí</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Todos los derechos reservados - Copyright 2026 ElectroHogar S.A.</p>
    </footer>
    <script src="script.js?v=16"></script>
</body>
</html>
