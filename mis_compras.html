<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHogar - Mis Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icono-electrohogar.png">
    <link rel="stylesheet" href="style.css?v=11">
    <style>
        .tarjeta-orden {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tarjeta-orden:hover {
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }
        .orden-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge-estado-orden {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-estado-orden.proceso { background: #e3f2fd; color: #1976d2; }
        .badge-estado-orden.confirmada { background: #e8f5e9; color: #2e7d32; }
        .badge-estado-orden.retiro { background: #fff8e1; color: #f57f17; }
        .badge-estado-orden.entregada { background: #f3e5f5; color: #7b1fa2; }
        .orden-grid {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 20px;
            align-items: center;
        }
        @media (max-width: 768px) {
            .orden-grid { grid-template-columns: 1fr; }
        }
        .item-orden-fila {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        .item-orden-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 4px;
            background: #fafafa;
            border: 1px solid #eee;
            padding: 2px;
        }
</style>
</head>
<body>

    <header>
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">
            <img src="img/icono-electrohogar.png" alt="Logotipo ElectroHogar" class="logo-img">
            <h1>ElectroHogar</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cocina.html">Cocina</a></li>
                <li><a href="lavado.html">Lavado</a></li>
                <li><a href="tecnologia.html">Tecnología</a></li>
                <li><a href="ofertas.html">Ofertas</a></li>
                <li><a href="sucursales.html">Sucursales</a></li>
            </ul>
        </nav>

        <div class="herramientas-usuario">
            <button class="btn-icon" id="btn-login" title="Iniciar sesión" onclick="window.location.href='login.html'">👤 Iniciar Sesión</button>
            <button class="btn-icon" id="btn-mis-compras" style="background:#007bff; color:#fff; font-weight:bold;" onclick="window.location.href='mis_compras.html'">📦 Mis Compras</button>
            <button class="btn-icon" id="btn-carrito" onclick="window.location.href='carrito.html'">🛒 Carrito (<span id="contador-carrito">0</span>)</button>
            <button class="btn-icon" id="btn-tema" title="Cambiar tema" onclick="cambiarTema()">🌙</button>
            <button id="btn-panel-admin" class="btn-icon" style="display: none;" onclick="window.location.href='panel_admin.html'">⚙️ Panel</button>
        </div>
    </header>

    <main>
        <div class="ofertas-header">
            <h2>📦 MIS COMPRAS REALIZADAS</h2>
            <p>Historial de pedidos, estados de entrega y comprobantes con código QR.</p>
        </div>

        <div id="contenedor-mis-compras" style="max-width: 1000px; margin: 0 auto;">
            <p style="text-align: center; padding: 40px; color: #666; font-size: 15px;">⏳ Cargando tu historial de compras...</p>
        </div>
    </main>

    <footer>
        <p>Todos los derechos reservados - Copyright 2026 ElectroHogar S.A.</p>
    </footer>

    <script src="script.js?v=11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarHistorialMisCompras();
        });

        function cargarHistorialMisCompras() {
            const cont = document.getElementById("contenedor-mis-compras");
            const u = obtenerUsuarioActivo();

            if (!u) {
                cont.innerHTML = `
                    <div style="background:#fff; border:1px solid #ddd; border-radius:8px; padding:40px 20px; text-align:center;">
                        <span style="font-size:42px;">🔐</span>
                        <h3 style="margin:12px 0 8px 0;">Inicia sesión para ver tus compras</h3>
                        <p style="color:#666; font-size:14px; margin-bottom:20px;">Debes autenticarte con tu cuenta de cliente para visualizar el historial de tus pedidos y códigos de retiro.</p>
                        <button onclick="window.location.href='login.html'" class="btn-comprar-grande" style="width:auto; padding:12px 30px; display:inline-block;">👤 Iniciar Sesión</button>
                    </div>
                `;
                return;
            }

            fetch('obtener_mis_compras.php')
                .then(r => r.json())
                .then(data => {
                    if (!data.exito) {
                        cont.innerHTML = `<p style="text-align:center; color:#dc3545; padding:30px;">${data.error}</p>`;
                        return;
                    }

                    if (!data.ordenes || data.ordenes.length === 0) {
                        cont.innerHTML = `
                            <div style="background:#fff; border:1px solid #ddd; border-radius:8px; padding:40px 20px; text-align:center;">
                                <span style="font-size:42px;">🛍️</span>
                                <h3 style="margin:12px 0 8px 0;">Aún no realizaste ninguna compra</h3>
                                <p style="color:#666; font-size:14px; margin-bottom:20px;">¡Explora nuestro catálogo con stock en tiempo real y realiza tu primer pedido!</p>
                                <button onclick="window.location.href='index.html'" class="btn-comprar-grande" style="width:auto; padding:12px 30px; display:inline-block;">Ver Productos</button>
                            </div>
                        `;
                        return;
                    }

                    cont.innerHTML = data.ordenes.map(ord => {
                        const itemsHTML = ord.items.map(it => `
                            <div class="item-orden-fila">
                                <img src="${escaparHTML(it.imagen)}" onerror="this.onerror=null;this.src='img/productos/placeholder.jpg';" class="item-orden-img">
                                <div style="flex:1;">
                                    <strong style="font-size:13.5px;">${escaparHTML(it.nombre)}</strong>
                                    <div style="font-size:12.5px; color:#666;">
                                        ${it.cantidad} unid. x $${Number(it.precio_unitario).toLocaleString('es-AR')} = <strong>$${Number(it.subtotal).toLocaleString('es-AR')}</strong>
                                    </div>
                                </div>
                            </div>
                        `).join("");

                        let detalleEntrega = "";
                        if (ord.tipo_entrega === "retiro" || ord.tipo_entrega.includes("retiro")) {
                            detalleEntrega = `🏪 <strong>Retiro en sucursal:</strong> ${escaparHTML(ord.nombre_sede)}`;
                        } else {
                            detalleEntrega = `🚚 <strong>Envío a domicilio:</strong> ${escaparHTML(ord.direccion || 'Dirección registrada')}`;
                        }

                        let fechaFmt = ord.fecha ? new Date(ord.fecha).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Reciente';

                        return `
                            <div class="tarjeta-orden">
                                <div class="orden-header">
                                    <div>
                                        <span style="font-size:12px; color:#888; text-transform:uppercase; font-weight:bold;">Código de Orden</span>
                                        <h3 style="margin:2px 0 0 0; color:#000; font-size:18px;">${escaparHTML(ord.codigo_seguimiento)}</h3>
                                        <small style="color:#666;">Fecha: ${fechaFmt}</small>
                                    </div>
                                    <div style="text-align:right;">
                                        <span class="badge-estado-orden confirmada">${escaparHTML(ord.estado_nombre)}</span>
                                        <div style="font-size:18px; font-weight:bold; color:#111; margin-top:6px;">$${Number(ord.total).toLocaleString('es-AR')}</div>
                                    </div>
                                </div>

                                <div class="orden-grid">
                                    <div>
                                        <div style="background:#f8f9fa; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:12px;">
                                            ${detalleEntrega}
                                        </div>
                                        <div>
                                            <span style="font-size:12.5px; font-weight:bold; color:#444; display:block; margin-bottom:6px;">Productos Comprados:</span>
                                            ${itemsHTML}
                                        </div>
                                    </div>
                                    <div style="text-align:center; background:#fafafa; border:1px solid #eee; border-radius:8px; padding:15px;">
                                        <img src="${ord.url_qr}" alt="Código QR de Retiro" style="width:130px; height:130px; background:#fff; border:1px solid #ddd; padding:4px; border-radius:6px;">
                                        <p style="font-size:11.5px; color:#555; margin:6px 0 10px 0;">Presenta este código QR y tu DNI para retirar o recibir</p>
                                        <button onclick="window.print()" style="padding:6px 12px; font-size:12px; background:#fff; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-weight:600;">🖨️ Imprimir</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join("");
                })
                .catch(err => {
                    console.error(err);
                    cont.innerHTML = "<p style='text-align:center; color:#dc3545; padding:30px;'>Error al cargar las compras. Intenta recargar la página.</p>";
                });
        }
</script>
</body>
</html>
