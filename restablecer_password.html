<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHogar - Restablecer Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icono-electrohogar.png">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header>
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">
            <img src="img/icono-electrohogar.png" alt="Logotipo ElectroHogar" class="logo-img">
            <h1>ElectroHogar</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cocina.html">Cocina</a></li>
                <li><a href="lavado.html">Lavado</a></li>
                <li><a href="tecnologia.html">Tecnología</a></li>
                <li><a href="ofertas.html">Ofertas</a></li>
                <li><a href="sucursales.html">Sucursales</a></li>
            </ul>
        </nav>

        <div class="herramientas-usuario">
            <button class="btn-icon" id="btn-login" title="Iniciar sesión" onclick="iniciarSesion()">👤 Iniciar Sesión</button>
            <button class="btn-icon" id="btn-tema" title="Cambiar tema" onclick="cambiarTema()">🌙</button>
        </div>
    </header>

    <main>
        <div class="contenedor-login" style="max-width: 440px;">
            <h2>🔑 Nueva Contraseña</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; text-align: center;">
                Ingresa y confirma tu nueva contraseña de acceso.
            </p>

            <form id="form-restablecer" onsubmit="procesarRestablecer(event)">
                <input type="hidden" id="reset-token">
                <input type="hidden" id="reset-email">

                <div class="form-group">
                    <label for="nueva-password">Nueva Contraseña:</label>
                    <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmar-password">Confirmar Nueva Contraseña:</label>
                    <input type="password" id="confirmar-password" placeholder="Repite la contraseña" required minlength="6">
                </div>

                <button type="submit" id="btn-submit-restablecer" class="btn-login" style="margin-top: 10px;">Guardar Nueva Contraseña</button>

                <div id="mensaje-restablecer" style="display: none; margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; line-height: 1.4;"></div>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="login.html" class="link-registro" style="font-size: 14px;">⬅️ Ir a Iniciar Sesión</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Todos los derechos reservados - Copyright 2026</p>
    </footer>

    <script src="script.js?v=5"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token") || "";
            const email = params.get("email") || "";
            document.getElementById("reset-token").value = token;
            document.getElementById("reset-email").value = email;

            if (!token || !email) {
                const boxMsg = document.getElementById("mensaje-restablecer");
                boxMsg.style.display = "block";
                boxMsg.style.backgroundColor = "#fff3cd";
                boxMsg.style.color = "#856404";
                boxMsg.style.border = "1px solid #ffeeba";
                boxMsg.innerHTML = "⚠️ Enlace incompleto o inválido. Si solicitaste la recuperación, asegúrate de ingresar con el enlace completo recibido por correo.";
            }
        });

        function procesarRestablecer(evento) {
            evento.preventDefault();
            const btn = document.getElementById("btn-submit-restablecer");
            const token = document.getElementById("reset-token").value.trim();
            const email = document.getElementById("reset-email").value.trim();
            const pass1 = document.getElementById("nueva-password").value;
            const pass2 = document.getElementById("confirmar-password").value;
            const boxMsg = document.getElementById("mensaje-restablecer");

            if (pass1 !== pass2) {
                boxMsg.style.display = "block";
                boxMsg.style.backgroundColor = "#ffebee";
                boxMsg.style.color = "#c62828";
                boxMsg.innerText = "Las contraseñas no coinciden. Verifícalas e intenta nuevamente.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Guardando contraseña...";

            fetch('restablecer_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, email, password: pass1 })
            })
            .then(res => res.json())
            .then(data => {
                boxMsg.style.display = "block";
                if (data.exito) {
                    boxMsg.style.backgroundColor = "#e8f5e9";
                    boxMsg.style.color = "#2e7d32";
                    boxMsg.style.border = "1px solid #c8e6c9";
                    boxMsg.innerHTML = "<strong>✅ ¡Contraseña actualizada con éxito!</strong><br>Serás redirigido/a al inicio de sesión...";
                    btn.innerText = "Guardado con éxito";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1800);
                } else {
                    boxMsg.style.backgroundColor = "#ffebee";
                    boxMsg.style.color = "#c62828";
                    boxMsg.style.border = "1px solid #ffcdd2";
                    boxMsg.innerHTML = `<strong>❌ Error:</strong> ${data.error}`;
                    btn.disabled = false;
                    btn.innerText = "Guardar Nueva Contraseña";
                }
            })
            .catch(() => {
                boxMsg.style.display = "block";
                boxMsg.style.backgroundColor = "#ffebee";
                boxMsg.style.color = "#c62828";
                boxMsg.innerText = "Error de conexión al actualizar la contraseña.";
                btn.disabled = false;
                btn.innerText = "Guardar Nueva Contraseña";
            });
        }
    </script>
</body>
</html>
