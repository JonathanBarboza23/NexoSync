<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | ElectroHogar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icono-electrohogar.png">
    <link rel="stylesheet" href="style.css?v=9">
    <style>
        .admin-layout { display: flex; flex: 1; width: 100%; min-width: 0; height: 100vh; margin: 0; }
        .sidebar { width: 260px; flex-shrink: 0; background: #111; color: #fff; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 18px; margin: 0 0 25px 0; text-align: center; }
        .nav-btn { background: none; border: none; color: #aaa; padding: 12px 14px; text-align: left; font-size: 14.5px; cursor: pointer; border-radius: 6px; margin-bottom: 6px; font-weight: 500; }
        .nav-btn:hover, .nav-btn.activo { background: #222; color: #fff; }
        .main-content { flex: 1; width: 100%; min-width: 0; padding: 30px; overflow-y: auto; background: #f8f9fa; box-sizing: border-box; }
        .modulo { display: none; width: 100%; }
        .modulo.activo { display: block; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        th, td { padding: 12px 14px; border-bottom: 1px solid #eee; text-align: left; font-size: 13.5px; }
        th { background: #f1f3f5; font-weight: 600; color: #333; }
        .input-stock { width: 75px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .btn-update { background: #000; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-logout { background: #dc3545; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .badge-estado { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 12px; font-size: 11.5px; font-weight: bold; display: inline-block; }
        .badge-estado.proceso { background: #e3f2fd; color: #1976d2; }
        .badge-estado.completado { background: #e8f5e9; color: #2e7d32; }
        .badge-estado.cancelado { background: #ffebee; color: #c62828; }
        .select-estado-orden { width: auto; min-width: 155px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-weight: 600; background: #fff; color: #222; cursor: pointer; }
    </style>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div class="sidebar">
            <h2>⚙️ ElectroHogar Admin</h2>
            <button class="nav-btn activo" onclick="cambiarPestana('modulo-inventario', this)">📦 Control de Inventario</button>
            <button class="nav-btn" onclick="cambiarPestana('modulo-ordenes', this)">📊 Órdenes y Ventas</button>
            <button class="nav-btn" style="background: #007bff; color: #fff; font-weight: bold; margin: 10px 0;" onclick="window.location.href='admin_db.html'">🗄️ Admin Base de Datos</button>
            <button class="nav-btn" onclick="window.location.href='index.html'">🏠 Ver Tienda</button>
            <button class="nav-btn" style="margin-top:auto; background:#dc3545; color:#fff;" onclick="cerrarSesionAdmin()">🚪 Cerrar Sesión</button>
        </div>

        <div class="main-content">
            <div id="modulo-inventario" class="modulo activo">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0; font-size:22px;">📦 Control de Stock por Sucursal</h3>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="buscador-admin" placeholder="🔍 Buscar producto..." oninput="filtrarInventario()" style="padding:8px 12px; border:1px solid #ccc; border-radius:4px; font-size:13px; width:220px;">
                        <select id="filtro-categoria-admin" onchange="filtrarInventario()" style="padding:8px 12px; border:1px solid #ccc; border-radius:4px; font-size:13px;">
                            <option value="todos">Todas las categorías</option>
                            <option value="cocina">Cocina</option>
                            <option value="lavado">Lavado</option>
                            <option value="tecnologia">Tecnología</option>
                        </select>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr id="fila-encabezado-stock"></tr>
                    </thead>
                    <tbody id="tabla-stock"></tbody>
                </table>
            </div>

            <div id="modulo-ordenes" class="modulo">
                <h3 style="margin:0 0 20px 0; font-size:22px;">📊 Historial de Órdenes y Facturación</h3>
                <table>
                    <thead>
                        <tr>
                            <th>N° Orden</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Entrega</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ordenes"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js?v=9"></script>
    <script src="admin.js?v=9"></script>
</body>
</html>
